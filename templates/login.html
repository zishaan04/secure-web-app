{% extends "base.html" %}
{% block title %}Login - SecureApp{% endblock %}
{% block content %}
    <h1>Login</h1>
    <form method="POST" class="form">
        <label>Username
            <input type="text" name="username" required>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit">Log In</button>
    </form>
{% endblock %}
